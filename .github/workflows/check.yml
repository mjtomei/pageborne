name: Source and builds
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Keep the runner compatible with the pinned Playwright browser build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:audit
      - run: npm test
      - run: npm run test:ocr
      - run: npm run build:ocr
      - run: npm run pack:release
      - run: npm run build:web
      - run: npm run build:debug
      - run: npm run release:audit -- --built
      - run: npx playwright install chromium
      - name: Public/private profile isolation
        run: |
          export CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:library-storage
          npm run test:library-recovery
          npm run test:library-on-demand
          npm run test:build-profiles
          node scripts/desktop-ocr-browser-test.mjs
          PAGE_TIME_BROWSER=chromium npm run test:page-time
          npm run test:display-recovery
          npm run test:sdk-timers
          ASK_BROWSER=chromium npm run test:ask-unread
          ASK_BROWSER=chromium npm run test:ask-sync
          ASK_BROWSER=chromium npm run test:ask-models
          npm run test:terminal-sessions
          LIBRARIAN_BROWSER=chromium npm run test:librarian
          npm run test:reading-history
          npm run test:speech:storage
          READING_BROWSER=chromium npm run test:reading-controls
          WEB_BROWSER=chromium npm run test:web
          WEB_BROWSER=chromium WEB_BUILT=1 npm run test:web
          npm run test:pdf-centering
          npm run test:pdf-decoders
          npm run test:contents
          npm run test:pdf-progress
          npm run test:pdf-live
          npm run test:pdf-annotations
          npm run test:pdf-scans
